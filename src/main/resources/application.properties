# ─────────────────────────────────────────────────────────────
# Pandit Aman Bhatore — Consultation Backend (No-DB edition)
# Copy this file to application-local.properties and fill in
# the values marked with <CHANGE_ME> before running.
# ─────────────────────────────────────────────────────────────



# ── Server ──────────────────────────────────────────────────
server.port=8080

# Increase max file upload (photos + PDFs can be large)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=40MB

# ── File Storage ─────────────────────────────────────────────
app.storage.base-dir=./uploads
app.storage.max-file-size-bytes=10485760

# ── Telegram Bot ────────────────────────────────────────────
telegram.bot.token=${TELEGRAM_BOT_TOKEN:7743280679:AAEetJLnPeoMKAZcYA3FM4N-5hmEp-K1jao}
telegram.bot.chat-id=${TELEGRAM_CHAT_ID:8823152262}

# @Retryable settings (inner retry inside TelegramApiService)
telegram.retry.max-attempts=5
telegram.retry.initial-delay-ms=2000
telegram.retry.multiplier=2.0
telegram.retry.max-delay-ms=60000

# ── Telegram Dispatch Queue ──────────────────────────────────
# Main queue capacity (tasks waiting for a worker)
telegram.queue.capacity=5000
# Number of dedicated worker threads
telegram.queue.workers=2
# Inter-send delay — keeps throughput < Telegram's 30 msg/s cap
telegram.queue.send-delay-ms=1000
# Base delay for exponential back-off on failed tasks (ms)
telegram.queue.retry-base-delay-ms=2000
# Hard ceiling on back-off delay (ms) — default 2 minutes
telegram.queue.retry-max-delay-ms=120000
# Dead-letter queue size cap
telegram.queue.dlq-capacity=500

# ── In-Memory State Store ────────────────────────────────────
# Max SENT records to retain before eviction
telegram.store.max-sent-records=10000
# SENT records older than this many hours are eligible for eviction
telegram.store.sent-ttl-hours=24

# ── CORS ─────────────────────────────────────────────────────
app.cors.allowed-origins=https://www.pamanbhatore.com/

# ── Actuator ─────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ── Logging ──────────────────────────────────────────────────
logging.level.com.panditaman=INFO
logging.level.org.springframework.retry=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
